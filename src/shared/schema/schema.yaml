info:
  title: dr-ikramov
  description: The dr-ikramov API description
  version: "0.1"
  contact: {}
tags: []
servers:
  - url: /
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuthDto:
      type: object
      properties:
        phone:
          type: string
          example: "+998901234567"
        password:
          type: string
          example: 123qazwsx
      required:
        - phone
        - password
    AuthEntity:
      type: object
      properties:
        accessToken:
          type: string
          readOnly: true
        refreshToken:
          type: string
          readOnly: true
        userId:
          type: number
          readOnly: true
        userRole:
          type: string
          readOnly: true
        veterinarianId:
          type: number
          readOnly: true
        farmerId:
          type: number
          readOnly: true
      required:
        - accessToken
        - refreshToken
        - userId
        - userRole
        - veterinarianId
        - farmerId
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: >-
            eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIsInJvbGUiOiJBRE1JTiIsImlhdCI6MTczMzIzMTAyNCwiZXhwIjoxNzMzODM1ODI0fQ.DNcX3QHIowkFxfw88Nh6pMXJNSqNPlZBYsf6uSW96dk
      required:
        - refreshToken
    CreateUserDto:
      type: object
      properties:
        phone:
          type: string
          description: The user's phone number in international format
          example: "+998901234567"
        password:
          type: string
          description: The user's password (hashed)
          example: 123qazwsx
        firstName:
          type: string
          description: The user's first name
          example: John
        lastName:
          type: string
          description: The user's last name
          example: Doe
        middleName:
          type: string
          description: The user's middle name
          example: Smith
          nullable: true
        gender:
          type: string
          description: The user's gender
          enum:
            - MALE
            - FEMALE
          nullable: true
          example: MALE
        birthDate:
